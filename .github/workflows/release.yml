name: .NET Build and Publish

on:
  push:
    branches: ["main", "installer-test/**"]
    tags: ["v*.*.*"] # Manual delivery on every version tag - own numbering starting at v0.1.0

jobs:
  build-connectors:
    runs-on: windows-latest # Keeping on windows for now, for cross platform building of exe projects, we need to use dotnet publish
    env:
      SEMVER: "unset"
      FILE_VERSION: "unset"
    outputs:
      semver: ${{ steps.set-version.outputs.semver }}
      file_version: ${{ steps.set-version.outputs.file_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.2xx # Align with global.json (including roll forward rules)

      # global.json is intentionally pinned to 8.0.417 in the committed repo (see its git
      # history - a deliberate local-dev workaround since only .NET 8 SDK is installed on
      # the primary dev machine, and building under the .NET 10 toolchain there trips up
      # stricter analyzer rules in the referenced speckle-sharp-sdk project). CI has no such
      # constraint and Build/Build.csproj (which `build.ps1 zip` depends on) targets net10.0,
      # so overwrite just this ephemeral checkout's global.json to unblock it here - never
      # committed back, so local dev is unaffected.
      - name: Use .NET 10 SDK pin for this CI run only
        shell: pwsh
        run: |
          '{"sdk":{"version":"10.0.200","rollForward":"latestMinor"}}' | Set-Content -Path global.json

      - name: Cache Nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: ⚒️ Run build and zip connectors
        run: ./build.ps1 zip

      - name: ⬆️ Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: output-${{ env.SEMVER }}
          path: output/*.*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # no compression

      - id: set-version
        name: Set version to output
        run: |
          echo "semver=${{ env.SEMVER }}" >> "$Env:GITHUB_OUTPUT"
          echo "file_version=${{ env.FILE_VERSION }}" >> "$Env:GITHUB_OUTPUT"

  build-installers:
    # This repo's own Inno Setup-based installer build, replacing the original
    # workflow_dispatch to specklesystems/connector-installers - that repo is
    # private to the specklesystems org and this fork has no access/secret for
    # it. See Installers/Revit and Installers/Tekla for the .iss scripts.
    runs-on: windows-latest
    needs: build-connectors
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: output-${{ needs.build-connectors.outputs.semver }}
          path: output

      - name: 📦 Extract connector zips
        shell: pwsh
        run: |
          Expand-Archive -Path output/revit.zip -DestinationPath output/revit -Force
          Expand-Archive -Path output/teklastructures.zip -DestinationPath output/teklastructures -Force

      - name: 🛠️ Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 🏗️ Compile Revit installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.build-connectors.outputs.semver }} Installers\Revit\speckle-revit-installer.iss

      - name: 🏗️ Compile Tekla installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.build-connectors.outputs.semver }} Installers\Tekla\speckle-tekla-installer.iss

      - name: ⬆️ Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ needs.build-connectors.outputs.semver }}
          path: output/installers/*.exe
          if-no-files-found: error

      - name: 📤 Attach installers to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: output/installers/*.exe

      # Allows us to inspect the artifacts of failed builds, since this below step will be skipped if the above steps fail
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: output-*
