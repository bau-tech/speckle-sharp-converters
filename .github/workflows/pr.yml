name: .NET Test

on:
  pull_request: {}
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.2xx # Align with global.json (including roll forward rules)

      # global.json is intentionally pinned to 8.0.417 in the committed repo (see release.yml
      # for the full rationale). Build/Build.csproj (which build.sh depends on) targets
      # net10.0, so overwrite just this ephemeral checkout's global.json to unblock it here -
      # never committed back, so local dev is unaffected.
      - name: Use .NET 10 SDK pin for this CI run only
        run: echo '{"sdk":{"version":"10.0.200","rollForward":"latestMinor"}}' > global.json

      - name: Cache Nuget
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: ⚒️ Run Test
        run: ./build.sh test-and-pack

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v6
        with:
          files: Converters/**/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      # Disabling this code for now, since we no longer need to publish nugets from this repo
      # But keeping it around incase we ever need in the future.
      # Ideally, I'd also like to move the nuget token to be an environment secret, and to have tight package scopes
#      - name: Push to nuget.org
#        if: ${{ inputs.deployNugets }}
#        run: dotnet nuget push output/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.CONNECTORS_NUGET_TOKEN }}
